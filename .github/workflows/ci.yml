name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: coinfinder
          POSTGRES_PASSWORD: coinfinder
          POSTGRES_DB: coinfinder
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U coinfinder"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      DATABASE_URL: postgresql://coinfinder:coinfinder@localhost:5432/coinfinder

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Format check
        run: uv run ruff format --check src tests scripts

      - name: Types
        run: uv run mypy

      - name: Tests
        run: uv run pytest -q
