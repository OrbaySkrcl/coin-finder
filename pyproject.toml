[project]
name = "coinfinder"
version = "0.1.0"
description = "Smart-money on-chain signal engine + honest backtesting lab (Base / Robinhood / BSC)"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.15",
    "aiohttp>=3.10",
    "asyncpg>=0.30",
    "eth-abi>=5.1",
    "eth-utils>=5.1",
    "fastapi>=0.115",
    "orjson>=3.10",
    "polars>=1.17",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "redis>=5.2",
    "structlog>=24.4",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coinfinder"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
packages = ["coinfinder"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
