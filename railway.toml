# Railway deploys three services from this one image.
#
#   api     - HTTP API + Strategy Lab dashboard (this file's default)
#   worker  - ingestion, scoring, signal engine, outcome tracking
#   bot     - Telegram bot and alert dispatch
#
# Add the PostgreSQL and Redis plugins, then set the shared variables once at
# the project level so all three services inherit them.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python scripts/migrate.py && python -m uvicorn coinfinder.api.main:app --host 0.0.0.0 --port ${PORT:-8000}"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# --- copy these into the matching Railway services -----------------------
#
# [worker]
# startCommand = "python -m coinfinder.worker.main"
#
# [bot]
# startCommand = "python -m coinfinder.bot.main"
#
# Only the api service needs a public domain. The worker and bot make
# outbound connections only, so leave them private.
