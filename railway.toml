# One service runs everything: API + dashboard, ingestion worker, and the
# Telegram bot. Splitting them is better at scale, but it triples the setup
# and every extra step is somewhere a mistake can hide.
#
# To split later, set RUN_COMPONENTS on each service (api / worker / bot).
# No code changes are needed.
#
# Required: attach the PostgreSQL plugin, then set
#   DATABASE_URL       = ${{Postgres.DATABASE_URL}}
#   TELEGRAM_BOT_TOKEN = <token from @BotFather>

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python -m coinfinder"
healthcheckPath = "/health"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
